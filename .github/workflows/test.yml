name: Test

on:
  push:
    branches: [main, master]
  pull_request:

# 门禁口径单源在 Makefile：本文件只编排 job 与矩阵环境，不各自拼 go test 参数。
# 本地 `make test` / `make lint` / `make arch` / `make eval` 过 = 本流水线绿。
jobs:
  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

  # 静态门禁（企业级 CI 必过项）：vet + staticcheck + gofmt 三合一走 make lint，
  # 命令单源在 Makefile；钉版本安装，规则与本地 `make lint` 完全一致。
  # IDL 漂移门禁（v6.3.0）：钉版 hz 再生成 + git diff 断言 biz/ 生成物与
  # idl/*.thrift 同步——「生成物手改失真」类（TaskKind 枚举手改前科）永久关闭。
  idl-drift:
    name: IDL drift (generated code in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install hz (pinned v0.9.8)
        run: GOFLAGS= go install github.com/cloudwego/hertz/cmd/hz@v0.9.8

      - name: Regenerate & assert no drift
        run: |
          make idl-gen
          git diff --exit-code -- biz/ .hz || {
            echo "::error::IDL 生成物与 idl/*.thrift 不同步：请本地跑 make idl-gen 并提交生成物";
            exit 1;
          }

  lint:
    name: Lint (vet + staticcheck + gofmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet + staticcheck + gofmt
        run: make lint

  # 可执行架构守卫：architecture-policy.yaml + kernel archcheck（声明面=可执行面）
  # + 包文档完整性 + 阈值/例外棘轮。依赖方向变更必须先改 policy。
  arch:
    name: Arch (policy + thresholds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Architecture guards
        run: make arch

  # 覆盖率棘轮：全局地板 + 单包不下降 + 新包 70%（baseline 只升不降）。
  coverage:
    name: Coverage (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Coverage gate
        run: make cover

  # 文档面：llms.txt 与 ARCHITECTURE.md 分层表由 policy 生成——手改即红。
  docs-sync:
    name: Docs sync (policy-generated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate & assert no drift
        run: |
          make docs
          git diff --exit-code -- llms.txt ARCHITECTURE.md || {
            echo "::error::llms.txt/ARCHITECTURE.md 与 policy 不同步：请本地跑 make docs 并提交生成物";
            exit 1;
          }

  # 生产方言（v6.1.7）：43 k8s 自 v5.4.8 起在役 PostgreSQL——矩阵必须覆盖。
  # 镜像与生产同款 postgres:16-alpine；DSN 接线 ARGUS_TEST_PG_DSN。
  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        env:
          ARGUS_TEST_PG_DSN: "postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable"
        run: make test

  test-mysql:
    name: Tests (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: argus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        env:
          ARGUS_TEST_MYSQL_DSN: "root:test@tcp(127.0.0.1:3306)/argus_test?parseTime=true"
        run: make test

  # 容器级混沌（#24 批 C）：testcontainers 拉真 pg/MySQL 跑五探针（行锁
  # fencing / SKIP LOCKED 双抢 / 唯一索引撞键 / 预留超卖 / 停机有界失败+
  # 恢复）+ runner 预算闸停机分支——单测级矩阵（test-sqlite 已含 make chaos
  # 面）之外的方言真实行为与真基础设施故障注入。独立 job：docker daemon +
  # 镜像拉取比 service container 重，失败面与常规测试隔离。
  chaos-container:
    name: Chaos (container pg/mysql)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: SQLite matrix (单测级)
        run: make chaos

      - name: Container chaos (容器级, testcontainers)
        run: make chaos-container

  golden-eval:
    name: Golden eval (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # G1a 评测门禁（v3.14.0）：打桩模式固化编排语义——R5 真值表/合并去重/
      # 反注入/证据门的回归必跑；真实模型 A/B 走独立定时工作流 eval-real.yml。
      # 注意 make eval 语义上覆盖了 test-sqlite 里的 TestGoldenReviewEval，
      # 独立成 job 是为了给分支保护一个可指名的必需检查项。
      - name: Run golden eval (stub, orchestration semantics)
        run: make eval
