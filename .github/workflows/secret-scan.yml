name: Secret Scan

# 交付物对齐（T6）：提交面密钥扫描。只读、零自定义凭据。
# gitleaks 官方 action v2 对 org 仓库强制要 license（GITLEAKS_LICENSE），
# 无 license 一律红——改用钉版 CLI + --no-git 树扫描（提交面口径，不翻历史
# 噪音）；高信号正则兜底层保留。eval/baseline 为合成评测语料（刻意播种
# 密钥样本），两处均豁免（gitleaks 走 .gitleaks.toml 路径豁免）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned CLI)
        run: |
          VER=v8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${VER}/gitleaks_${VER#v}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Run gitleaks (tree scan)
        run: /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

  # 高信号正则兜底（gitleaks 不可用/配置漂移时仍有一层）
  heuristic:
    name: heuristic-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scan for high-signal secret patterns
        run: |
          set +e
          # 排除测试夹具/文档示例/生成物；eval/baseline=合成评测语料（刻意
          # 播种密钥样本供审查器召回评测，非真实凭据）。
          FAIL=0
          # 私钥块
          if grep -rn --include='*.go' --include='*.yaml' --include='*.yml' --include='*.env' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=testdata \
              --exclude-dir=.worktrees \
              -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' . 2>/dev/null \
              | grep -v '_test.go' | grep -v 'example' | grep -v 'eval/baseline' ; then
            echo "::error::Possible private key material in tree"
            FAIL=1
          fi
          # AWS 长期密钥形态
          if grep -rn --include='*.go' --include='*.yaml' --include='*.yml' \
              --exclude-dir=.git --exclude-dir=testdata --exclude-dir=.worktrees \
              -E 'AKIA[0-9A-Z]{16}' . 2>/dev/null \
              | grep -v '_test.go' | grep -v 'eval/baseline' ; then
            echo "::error::Possible AWS access key id"
            FAIL=1
          fi
          exit $FAIL
