name: Secret Scan

# 交付物对齐（T6）：提交面密钥扫描。只读、零自定义凭据。
# 使用 gitleaks 若可用，否则退化为高信号正则（防 CI 无 gitleaks 时直接红）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  # 高信号正则兜底（即使 gitleaks action 不可用也有一层）
  heuristic:
    name: heuristic-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan for high-signal secret patterns
        run: |
          set +e
          # 排除测试夹具/文档示例/生成物
          FAIL=0
          # 私钥块
          if grep -rn --include='*.go' --include='*.yaml' --include='*.yml' --include='*.env' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=testdata \
              --exclude-dir=.worktrees \
              -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' . 2>/dev/null | grep -v '_test.go' | grep -v 'example' ; then
            echo "::error::Possible private key material in tree"
            FAIL=1
          fi
          # AWS 长期密钥形态
          if grep -rn --include='*.go' --include='*.yaml' --include='*.yml' \
              --exclude-dir=.git --exclude-dir=testdata --exclude-dir=.worktrees \
              -E 'AKIA[0-9A-Z]{16}' . 2>/dev/null | grep -v '_test.go'; then
            echo "::error::Possible AWS access key id"
            FAIL=1
          fi
          exit $FAIL
