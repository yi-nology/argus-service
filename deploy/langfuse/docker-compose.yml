# Langfuse v3 自托管最小栈（内网观测台，#langfuse 接入配套）。
# 拓扑：web + worker + postgres + clickhouse + redis + minio（v3 官方架构）。
# argus 侧接线（见 deploy/langfuse/README.md）：
#   ARGUS_OTEL_ENDPOINT=http://<host>:3000/api/public/otel
#   ARGUS_OTEL_PROTOCOL=http   # Langfuse 只吃 OTLP/HTTP（无 gRPC）
#   ARGUS_OTEL_HEADERS="Authorization: Basic <base64(pk:sk)>"
# 数据面：仅内网观测计量/延迟/归因（argus 侧不发 prompt/completion 文本）。
services:
  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes: [lf-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_MIGRATION_USER: clickhouse
      CLICKHOUSE_MIGRATION_PASSWORD: clickhouse
    volumes:
      - lf-ch:/var/lib/clickhouse
      - ./clickhouse-single-node.xml:/etc/clickhouse-server/config.d/zz-keeper.xml:ro
    ulimits: { nofile: 262144 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass lfredis
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data
    ports: ["19000:9000"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes: [lf-minio:/data]
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    depends_on: { langfuse-db: { condition: service_healthy } }
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_MIGRATION_USER: clickhouse
      CLICKHOUSE_MIGRATION_PASSWORD: clickhouse
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: lfredis
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: miniosecret
      S3_BUCKET: langfuse
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      SALT: ${LANGFUSE_SALT:?openssl rand -hex 32}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?openssl rand -base64 32}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?openssl rand -hex 32}
      TELEMETRY_ENABLED: "false"
      # bootstrap（启动自建 org/project/keys，幂等）——本地实弹/内网首启用
      LANGFUSE_INIT_ORG_ID: argus-org
      LANGFUSE_INIT_ORG_NAME: argus
      LANGFUSE_INIT_PROJECT_ID: argus-prod
      LANGFUSE_INIT_PROJECT_NAME: argus-prod
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PK:-pk-lf-change-me}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SK:-sk-lf-change-me}
      LANGFUSE_INIT_USER_EMAIL: admin@argus.local
      LANGFUSE_INIT_USER_NAME: argus-admin
      LANGFUSE_INIT_USER_PASSWORD: ArgusLocal123!
    restart: unless-stopped

  langfuse-web:
    image: langfuse/langfuse:3
    depends_on: [langfuse-worker]
    ports: ["3000:3000"]
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3000
    restart: unless-stopped

volumes:
  lf-db: {}
  lf-ch: {}
  lf-minio: {}
