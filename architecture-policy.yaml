execution_paths:
  enabled: false
  desc: argus 不接 kernel sandbox 登记簿；唯一子进程入口由 argus-exec-single-entry 保证（os/exec 仅 internal/execx）。kernel execution_paths 判的是对裸入口（如 ptc.Run）的调用，不判 os/exec；在本仓启用会反过来把 execx.Run 调用判红，属判据误用。
  severity: error

egress_paths:
  enabled: false
  desc: argus 暂无子进程出口策略；C4 acpx 沙箱项再启用（对 kernel 默认开启口径的有理由偏离）

# 租户过滤漏拼门：kernel 缺省关闭（形状=授权类型/租户字段/扫描面，没有形状就
# 判不了）。argus 当前是单租户部署模型，未声明这些形状，故显式关闭并写明理由；
# 引入多租户/工作区隔离时先在本段登记形状再开启。
tenant_gate:
  enabled: false
  desc: argus 单租户部署缺省关闭（kernel 缺省亦关闭）；无 auth_context_types/tenant_fields 形状，开启只会全量假红。多租户/工作区隔离立项时再声明形状并启门。

exceptions:
  - rule: harness-ptc-unmanaged-escape
    path: internal/qa/ptc.go
    line: 136
    reason: QA PTC 工具面在构造期已收口（进程内白名单 + 只读工作副本 + 检索预算），无可披露/出站面；显式声明逃逸
    until: "2027-01-31"
    removal: "接入 ptc invoke.Stage 判定环后删除"
