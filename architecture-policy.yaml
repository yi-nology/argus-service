# argus 架构治理策略（声明面 + 可执行面）
#
# 由 goagent-kernel/archcheck 执行：`make arch`。
# 改依赖方向先改本文件，再写代码；exceptions 是债，必须带 reason/until/removal。
# 根 main 由 kernel 的 packageDirs 跳过；biz/test 等生成面在 ignore_dirs。
version: 1
require_rule_examples: true

