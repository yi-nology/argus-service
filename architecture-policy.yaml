    - internal/langcap
    - internal/learning
    - internal/memorykernel
    - internal/notify
    - internal/notify/octopus
    - internal/obs
    - internal/ocrdeleg
    - internal/ocrshim
    - internal/outbound
    - internal/plugin
    - internal/plugin/adapter_acpx
    - internal/plugin/adapter_builtin
    - internal/plugin/adapter_cli
    - internal/plugin/adapter_remote
    - internal/poller
    - internal/poster
    - internal/progress
    - internal/qa
    - internal/qconsole
    - internal/qualityops
