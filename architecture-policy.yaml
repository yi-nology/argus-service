    - github.com/oagentkit/mcpkit
    - go.opentelemetry.io/otel
    - github.com/oagentkit/obs
    - github.com/oagentkit/queue
    - github.com/oagentkit/rag
    - github.com/oagentkit/runtime
    - github.com/oagentkit/skillkit
    - github.com/oagentkit/textx
    - github.com/oagentkit/toolgate
    - github.com/oagentkit/tools
    - github.com/oekit/bootstrap
    - github.com/oekit/concurrency
    - github.com/oekit/core
    - github.com/oekit/data
    - github.com/oekit/kitx
    - github.com/oekit/logx
    - github.com/oekit/metrics
    - github.com/oekit/middleware
    - github.com/oekit/pkg
    - github.com/oekit/tracing
    - github.com/prometheus/client_golang
    - github.com/prometheus/client_model
    - github.com/yi-nology/agent-memory
    - github.com/yi-nology/go-git-platform
    - github.com/yi-nology/goagent-kernel
    - golang.org/x/time/rate
    - golang.org/x/tools/cover
    - golang.org/x/tools/go/packages
    - golang.org/x/tools/go/types/typeutil
    - gopkg.in/yaml.v3
    - gorm.io/driver
    - gorm.io/gorm
    - mvdan.cc/sh

rules:

  - id: argus-bootstrap-single-entry
    desc: 组合根单向性——internal 包不得 import bootstrap（根 main 在 scope 外）
    severity: error
    scope: [internal]
    forbid_import_regex: '^github\.com/yi-nology/argus/internal/bootstrap$'
    examples:
      - { text: 'github.com/yi-nology/argus/internal/bootstrap', want: hit }
      - { text: 'github.com/yi-nology/argus/internal/plugin', want: miss }

  - id: argus-no-harness-internal
    desc: 宿主不得上溯 harness 内部包（kernel/oekit/oagentkit 的 internal）
    severity: error
    scope: [internal]
    forbid_import_regex: '^github\.com/yi-nology/goagent-kernel/internal(/|$)|^github\.com/oekit/[a-z0-9]+/internal(/|$)|^github\.com/oagentkit/[a-z0-9]+/internal(/|$)'
    examples:
      - { text: 'github.com/yi-nology/goagent-kernel/internal/subhub', want: hit }
      - { text: 'github.com/yi-nology/goagent-kernel/internal', want: hit }
      - { text: 'github.com/oekit/data/internal/dialect', want: hit }
      - { text: 'github.com/oekit/data/internal', want: hit }
      - { text: 'github.com/oagentkit/llm/internal/transport', want: hit }
      - { text: 'github.com/oagentkit/llm/internal', want: hit }
      - { text: 'github.com/yi-nology/goagent-kernel/spill', want: miss }

  - id: argus-no-bare-goroutine
    desc: 生产代码禁止裸 go，必须走 oekit/concurrency async
    severity: error
    scope: [internal]
    ignore_test: true
    forbid_regex: '^\s*go\s+(func\(|(?:[A-Za-z_]\w*\.)*[A-Za-z_]\w*\()'
    examples:
      - { text: "\tgo func() {", want: hit }
      - { text: "\tasync.GoSafe(ctx, log, fn)", want: miss }

  - id: argus-single-errors
    desc: 单一 errors 包——stdlib errors；禁止第三方 errors 包装层
    severity: error
    scope: [internal]
    forbid_import_regex: '^github\.com/pkg/errors$|^github\.com/go-errors/errors$'
    examples:
      - { text: 'github.com/pkg/errors', want: hit }
      - { text: 'github.com/go-errors/errors', want: hit }
      - { text: 'errors', want: miss }

  - id: argus-exec-single-entry
    desc: 只判 internal 生产代码里的直接 os/exec import（测试文件与 execx 自身除外）；procx.Run 等包装调用不在本规则判据内，另行跟踪
    severity: error
    scope: [internal]
    ignore_test: true
    scope_exclude: [internal/execx]
    forbid_import_regex: '^os/exec$'
    examples:
      - { text: 'os/exec', want: hit }
      - { text: 'github.com/yi-nology/argus/internal/execx', want: miss }

  - id: argus-no-direct-procx
    desc: procx 只允许经 execx 门面（唯一子进程托管入口；请求/超时/截断/错误语义由门面原样透传）
    severity: error
    # 命令层已收编进 internal/cli（tool 子命令同样受本规则约束）；仓根 main.go
    # 由 kernel 组合根判据覆盖，且不直接 import procx。
    scope: [internal]
    scope_exclude: [internal/execx]
    forbid_import_regex: '^github\.com/oagentkit/runtime/procx$'
    examples:
      - { text: 'github.com/oagentkit/runtime/procx', want: hit }
      - { text: 'github.com/yi-nology/argus/internal/execx', want: miss }

  - id: argus-no-printf-log-callback
    desc: 禁止 logger 回调形态，统一 logx.Logger（存量已清理，升 error 防回潮）
    severity: error
    scope: [internal]
    forbid_regex: '(?:logf|logFunc|logFn|logger)\s+func\('
    examples:
      - { text: 'logger func(name string, args ...any)', want: hit }
      - { text: 'logf func(msg string)', want: hit }
      - { text: 'logFunc func()', want: hit }
      - { text: 'logFn func()', want: hit }
      - { text: 'log logx.Logger', want: miss }

# word_tables：判定词表登记门禁（kernel v0.44-0.46 红利接线）——取值决定
# 结论的词表登记后背书：别的包手抄字面量即红（owner.Const 引用放行）；
