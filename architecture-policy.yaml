# 执行沙箱后端的档位声明（#37）：后端自报的隔离档位必须有人签字。
sandbox_providers:
  enabled: true
  desc: 执行沙箱后端档位声明——acpx 子进程面显式自报 LevelProcess，不冒充容器/VM；档位与代码事实由本段核对。
  providers:
    - id: acpx-subprocess
      level: LevelProcess
      package: internal/acpxsandbox
      supports: [wall_clock]
      notes: acpx CLI agent 子进程（spawn 在 oagentkit/tools/acpx 内）；readonly/write/network 是 provider-native 文件系统档，不是内核隔离档。出站只声明 Unrestricted（环境变量是建议，不做强制），proxy/denied 要求会被 gatecheck 拒绝。

execution_paths:
  enabled: true
  desc: 执行必须经 guardx/sandbox 登记簿（#37）：qa PTC 已从裸 ptc.Run 改走 sandbox.Execute→ptc.Provider（LevelProcess），裸 ptc.Run 调用清零；execx 仍是唯一 os/exec 出口（argus-exec-single-entry），两者判据面不同（裸执行入口 vs spawn 点）。
  severity: error

egress_paths:
  enabled: true
  desc: 每个子进程启动点登记出口档位（#37 开启）。运行时唯一 spawn 在 internal/execx.Run（环境已改 procx.ChildEnv 白名单，无 os.Environ 全量继承）；开发期工具（archgen/modcheck 等）也统一经 execx 门面启动子进程——出口面就是 internal/execx 已登记条目，调用侧不再重复登记（kernel 只认 os/exec 系直调，门面调用方登记会被判「已登记但偏离」）。acpx 的 spawn 在 oagentkit/tools/acpx 内（本门禁看不见），adapter 在调用前用 egress.Spec.Env/Verify + 后端能力问询拒绝受限出口（internal/acpxsandbox）。
  severity: error
  entries:
    - path: internal/execx/execx.go
      fn: Run
      mode: unrestricted
      notes: 唯一运行时子进程出口；通用 execx 不承诺出口代理，受限出口由具体调用方在 env 里声明。子进程环境经 procx.ChildEnv 白名单 + execpolicy 剥离。

# 宿主接缝契约门禁（kernel v0.43.0 #369/#370 红利）：三门——
# 形态 B 契约标记（error）/ 形态 A 锁内时钟访问器扫描（warn）/ 形态 C panic 外溢（error）。
# argus 时钟接缝面极小（dispatch.Now 字段 + SideEffectStore.UseClock 方法），
# 一次标记到位；min_declarations=1 防扫描面漂移后静默变绿。
seams:
  enabled: true
  severity: error
  marker: "@seam:"
  required: [no-reentry, no-blocking]
  panic_dispositions: [panic-isolated, panic-caller]
  min_declarations: 1
  lock_scan:
    severity: warn
  panic_scan:
    # 显式关闭：当前无已登记的 guarded_calls（kernel 自检拒绝「启用但空清单」，
    # 那等于一条都不判还自称开着门）。首个恐慌接缝候选登记时同步置 true。
    enabled: false
    severity: error

# 租户过滤漏拼门：kernel 缺省关闭（形状=授权类型/租户字段/扫描面，没有形状就
# 判不了）。argus 当前是单租户部署模型，未声明这些形状，故显式关闭并写明理由；
# 引入多租户/工作区隔离时先在本段登记形状再开启。
tenant_gate:
  enabled: false
  desc: argus 单租户部署缺省关闭（kernel 缺省亦关闭）；无 auth_context_types/tenant_fields 形状，开启只会全量假红。多租户/工作区隔离立项时再声明形状并启门。

exceptions:
  - rule: harness-ptc-unmanaged-escape
    path: internal/qa/ptc_sandbox.go
    line: 30
    reason: QA PTC 工具面在构造期已收口（进程内白名单 + 只读工作副本 + 检索预算），无可披露/出站面；执行已改经 sandbox 登记簿（execution_paths），此处仅保留显式未受管逃逸声明
    until: "2027-01-31"
    removal: "接入 ptc invoke.Stage 判定环后删除"
