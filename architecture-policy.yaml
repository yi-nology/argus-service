    owner: argus
    managed: true
    notes: acpx 执行沙箱（#37）——kernel 五项 backend/gatecheck/preset/cmdpolicy/egress 的装配面；IsolationProcess + EgressUnrestricted 自报，不冒充容器/禁网
  - id: agentstream
    roots: [internal/agentstream]
    requires: [ext:github.com/oagentkit/agent, ext:github.com/yi-nology/goagent-kernel]
    owner: argus
    managed: true
    notes: agentrun 原生流式事件 → kernel delta.Pacer 节流增量（纯适配层，无 internal 依赖）
